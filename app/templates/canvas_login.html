<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas sign in · Print Scan Grade</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="auth-page"><section class="auth-card"><p class="eyebrow">Print <span>Scan</span> Grade</p><h1>Instructor sign in</h1><p>Sign in to choose a Canvas course.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="next" value="{{ next }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section></main><style>.auth-page{min-height:100svh;display:grid;place-items:center;padding:24px;background:#101b2b}.auth-card{width:min(100%,430px);padding:34px;border:1px solid #36616a;border-radius:20px;background:#1c2a3b}.auth-card h1,.auth-card p{color:#fff}.auth-card label{display:block;color:white;margin:16px 0}.auth-card input{display:block;width:100%;padding:12px;box-sizing:border-box}.auth-card button{padding:12px;background:#75ddca;border:0;border-radius:8px}.error{color:#ff9d9d!important}</style></body></html>
