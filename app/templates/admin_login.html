<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><style>.auth-page{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 18%,#1d4c55 0,transparent 35%),#101b2b}.auth-card{width:min(100%,430px);padding:34px;border:1px solid #36616a;border-radius:20px;background:#ffffff0c;box-shadow:0 20px 60px #0003}.auth-card h1{font-size:2.4rem;letter-spacing:-.05em}.auth-card h1 span,.eyebrow span{color:#75ddca}.auth-card p{color:#c4d2d5;line-height:1.5}.auth-card label{display:block;color:#f7f6f2;font-weight:700;margin:18px 0 0}.auth-card input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #527079;border-radius:10px;background:#101b2b;color:#fff;font:inherit}.auth-card button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:10px;background:#75ddca;color:#101b2b;font:inherit;font-weight:800;cursor:pointer}.error{padding:10px 12px;border-radius:10px;background:#8f3d4b;color:#fff}</style></head><body><main class="auth-page"><section class="auth-card"><p class="eyebrow">Print <span>Scan</span> Grade</p><h1>Admin sign in</h1><p>Sign in to manage the LTI platform and client connections.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="next" value="{{ next }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p><a href="{{ url_for('home') }}">Return to homepage</a></p></section></main></body></html>
