<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select Canvas course · Print Scan Grade</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="page"><h1>Select a <span>Canvas course</span></h1><p>Choose a Canvas connection and course to open its Print Scan Grade workspace.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="get"><label for="connection_id">Canvas connection</label><select id="connection_id" name="connection_id" onchange="this.form.submit()" required>{% for connection in connections %}<option value="{{ connection.id }}" {% if connection.id == selected_connection %}selected{% endif %}>{{ connection.name }} · {{ connection.base_url }}</option>{% endfor %}</select></form>{% if not connections %}<p>No Canvas connections are configured. Ask the app administrator to add one.</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ session['canvas_csrf'] }}"><input type="hidden" name="connection_id" value="{{ selected_connection or '' }}"><label for="course_id">Course</label><select id="course_id" name="course_id" required>{% for course in courses %}<option value="{{ course.id }}">{{ course.name }}</option>{% endfor %}</select><button type="submit" {% if not courses %}disabled{% endif %}>Open course</button></form><form method="post" action="{{ url_for('canvas_logout') }}"><input type="hidden" name="csrf_token" value="{{ session['canvas_csrf'] }}"><button type="submit">Sign out</button></form></main></body></html>
