<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>Confirm LTI registration · Print Scan Grade</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .confirm-card{margin:32px auto 0;padding:24px;text-align:left;border:1px solid #36616a;border-radius:16px;background:#ffffff0c}
    .confirm-card h2{margin:0 0 12px;font-size:1.15rem}
    .confirm-card p{color:#c4d2d5;line-height:1.6;overflow-wrap:anywhere}
    .confirm-card code{color:#75ddca}
    .confirm-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
    .confirm-actions a{color:#c4d2d5}
    @media(max-width:520px){.confirm-actions{align-items:stretch;flex-direction:column}.confirm-actions .copy-button{width:100%}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="" width="104" height="104">
      <p class="eyebrow">LTI 1.3 registration</p>
      <h1>Connect <span>platform</span></h1>
      <p class="lead">Review the learning platform and access requested before creating the registration.</p>
      <div class="confirm-card">
        <h2>Platform issuer</h2>
        <p><code>{{ issuer }}</code></p>
        <h2>Requested access</h2>
        <p>Read-only access to course membership and roster information through LTI Names and Role Provisioning Service (NRPS).</p>
        <form method="post" action="{{ url_for('lti_dynamic_registration') }}">
          <input type="hidden" name="request_id" value="{{ request_id }}">
          <div class="confirm-actions">
            <button class="copy-button" type="submit">Register Print Scan Grade</button>
            <a href="{{ url_for('home') }}">Cancel</a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
